; OrvynCRM queue workers under Supervisor (adjust paths/user, then: supervisorctl reread && supervisorctl update).
; Every company shares these pools: a job carries its company id and each worker opens that company's database.
; Stop gracefully with:  supervisorctl stop orvyn-fast:*  (workers finish the job in hand; stopwaitsecs is the limit).
; Restart after a deploy with:  php artisan queue:restart

; Short, latency-sensitive work: ticks, automations, webhooks, everything else.
[program:orvyn-fast]
command=php /var/www/orvyn/artisan queue:work %(ENV_QUEUE_CONNECTION)s --queue=ticks,automations,webhooks,default --sleep=1 --tries=3 --max-time=3600 --max-jobs=1000
process_name=%(program_name)s_%(process_num)02d
numprocs=4
user=www-data
autostart=true
autorestart=true
stopasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/orvyn/fast.log

; Outbound e-mail/SMS: kept apart so a large campaign never delays automations.
[program:orvyn-messages]
command=php /var/www/orvyn/artisan queue:work %(ENV_QUEUE_CONNECTION)s --queue=messages --sleep=1 --tries=3 --max-time=3600 --max-jobs=1000
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autostart=true
autorestart=true
stopasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/orvyn/messages.log

; Long jobs (imports, syncs) run on their own connection whose retry_after is longer than the longest job,
; so a slow import is never handed to a second worker. QUEUE_LONG_CONNECTION defaults to <connection>-long.
[program:orvyn-long]
command=php /var/www/orvyn/artisan queue:work %(ENV_QUEUE_LONG_CONNECTION)s --queue=sync,imports,messages,default --sleep=3 --tries=1 --timeout=3600 --max-time=7200
process_name=%(program_name)s_%(process_num)02d
numprocs=1
user=www-data
autostart=true
autorestart=true
stopasgroup=true
stopwaitsecs=3700
redirect_stderr=true
stdout_logfile=/var/log/orvyn/long.log

; The scheduler (one per deployment, not per server pool): queues one tick per active company every minute.
[program:orvyn-scheduler]
command=php /var/www/orvyn/artisan schedule:work
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/orvyn/scheduler.log

[group:orvyn-fast]
programs=orvyn-fast
